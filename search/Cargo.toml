[package]
name = "search"
version = "0.1.0"
edition = "2024"

[dependencies]
kagi-openapi-rust = {workspace = true}
dotenvy = {workspace = true}
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"

[dependencies.tokio]
version = "1.53"
features = ["macros", "rt-multi-thread"]

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls", "query", "json"]
