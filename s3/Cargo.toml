[package]
name = "s3"
version = "0.1.0"
edition = "2024"

[dependencies]
opendal = {version = "*", features = ["services-s3"]}
# futures 0.3.34 currently references futures-executor 0.3.34, which is not
# available in the registry index used by this project. OpenDAL only needs
# futures' std/async-await functionality, so keep the dependency family at
# the latest available compatible release.
futures = "=0.3.32"
tokio = {workspace = true}
dotenvy = {workspace = true}
